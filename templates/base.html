{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MyShop{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{% url 'home' %}">
            MyShop
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'home' %}"
                    >
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'products' %}"
                    >
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'categories' %}">
                        Categories
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'cart' %}"
                    >
                        Cart
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'orders' %}"
                    >
                        Orders
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'profile' %}"
                    >
                        Profile
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        id="authLink"
                        href="{% url 'login' %}"
                    >
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<main>

    {% block content %}

    {% endblock %}

</main>


<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white text-center py-4 mt-5">

    <p class="mb-0">
        MyShop © 2026
    </p>

</footer>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Our JavaScript -->

<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>


{% block extra_js %}

{% endblock %}

</body>
</html>
